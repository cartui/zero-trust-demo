apiVersion: ingress.pomerium.io/v1
kind: Pomerium
metadata:
  name: global
spec:
  secrets: pomerium/bootstrap
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    ingress.pomerium.io/allow_websockets: 'true'
    ingress.pomerium.io/preserve_host_header: 'true'
    ingress.pomerium.io/pass_identity_headers: 'true'
    ingress.pomerium.io/subtle_allow_empty_host: 'true'
    # TODO: Fill this out with actual demo policies
    ingress.pomerium.io/policy: |
      allow:
        and:
        - accept: true
  name: web-ingress
spec:
  ingressClassName: pomerium
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-web
                port:
                  name: http
          - path: /term
            pathType: Prefix
            backend:
              service:
                name: web-terminal
                port:
                  name: http
          - path: /keycloak
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
